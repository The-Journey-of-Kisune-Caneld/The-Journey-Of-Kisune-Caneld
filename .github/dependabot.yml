version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 10
    groups:
      actions-all:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    assignees:
      - "Kisune-Caneld"
    reviewers:
      - "JuniorThanhBQ"
    labels:
      - "dependencies"
      - "github-actions"
    cooldown:
      default-days: 7
